global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "meeting-intelligence-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["backend:8000", "host.docker.internal:8000", "localhost:8000"]
        labels:
          service: "meeting-intelligence-api"
          environment: "production"
