services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    image: meeting-intelligence-backend:latest
    container_name: meeting-intelligence-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./Backend/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - APP_ENV=production
      - PORT=8000
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - backend-uploads:/tmp/meeting-agent-uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    image: meeting-intelligence-frontend:latest
    container_name: meeting-intelligence-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-uploads:
    driver: local
