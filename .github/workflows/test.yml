name: CI Test Suite

'on':
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run 244 Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        id: test_run
        continue-on-error: true
        env:
          PYTHONPATH: .
          GROQ_API_KEY: "test-groq-key"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DATABASE_URL_SYNC: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-32-chars-long-valid"
          STORAGE_BACKEND: "local"
        run: |
          python -m pytest tests/ --tb=short -ra --junitxml=pytest-report.xml

      - name: Publish Test Summary
        if: always()
        run: |
          python -c "
          import xml.etree.ElementTree as ET, os
          if os.path.exists('pytest-report.xml'):
              tree = ET.parse('pytest-report.xml')
              root = tree.getroot()
              failures = []
              for ts in root.iter('testsuite'):
                  for tc in ts.iter('testcase'):
                      for f in tc.iter('failure'):
                          failures.append(f'{tc.attrib.get(\"classname\")}.{tc.attrib.get(\"name\")}: {f.attrib.get(\"message\", \"\")[:200]}')
                      for e in tc.iter('error'):
                          failures.append(f'ERROR: {tc.attrib.get(\"classname\")}.{tc.attrib.get(\"name\")}: {e.attrib.get(\"message\", \"\")[:200]}')
              summary = f'### Test Results\n- Failures: {len(failures)}\n'
              if failures:
                  summary += '#### Failed Tests:\n' + '\n'.join(f'- {f}' for f in failures[:20])
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write(summary)
              print(summary)
          "

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: Backend/pytest-report.xml
          retention-days: 7

      - name: Check test suite outcome
        if: steps.test_run.outcome == 'failure'
        run: exit 1

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check Backend/ --ignore E501,E402
        continue-on-error: true

