name: Evaluation Harness & Quality Gate

on:
  push:
    branches: [ main ]
    paths:
      - 'eval/**'
      - 'Backend/**'
      - '.github/workflows/eval-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'eval/**'
      - 'Backend/**'
      - '.github/workflows/eval-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluation-gate:
    name: Benchmark Evaluation Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings httpx pytest jiwer python-dotenv

      - name: 1. Validate Dataset Schemas
        run: |
          python -m eval.validate_dataset --dataset-dir eval/datasets

      - name: 2. Validate LLM Judge Calibration (30 Human Labels)
        run: |
          python -m eval.metrics.judge_calibration

      - name: 3. Run Benchmark Evaluation & CI Threshold Check
        run: |
          python -m eval.run_eval --dataset-dir eval/datasets --min-f1 0.75 --min-faithfulness 0.70

      - name: Upload Evaluation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-evaluation-reports
          path: |
            eval/results/baseline_report.json
            eval/results/baseline_report.md
            eval/results/live_pipeline_report.md
            eval/results/live_pipeline_report.json
          retention-days: 14
